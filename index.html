  <!-- FAST TEKST (byttes ved scrolling) -->
  <div class="ann-fixed" aria-live="polite">
    <div class="af af-left"><span class="cap af-index">01</span><span class="cap af-title">Kirke</span></div>
    <div class="af af-right"><span class="cap af-material">Grønn marmor</span><span class="cap af-year">2026</span></div>

  <!-- FOOTER BAR -->
  <div class="footbar">
    <span class="cap">Utvalgte arbeider</span>
    <span class="cap">© 2026</span>
  </div>

<script>
(function(){
  var secs=[].slice.call(document.querySelectorAll('.project'));
  var box=document.querySelector('.ann-fixed');
  if(!secs.length||!box)return;
  var el={i:box.querySelector('.af-index'),t:box.querySelector('.af-title'),m:box.querySelector('.af-material'),y:box.querySelector('.af-year')};
  var cur=null,timer;
  function show(sec){
    if(sec===cur)return; cur=sec;
    box.classList.add('swap');
    clearTimeout(timer);
    timer=setTimeout(function(){
      el.i.textContent=sec.dataset.index;
      el.t.textContent=sec.dataset.title;
      el.m.textContent=sec.dataset.material;
      el.y.textContent=sec.dataset.year;
      box.classList.remove('swap');
    },220);
  }
  if(!('IntersectionObserver' in window))return;
  var io=new IntersectionObserver(function(es){
    es.forEach(function(e){if(e.isIntersecting)show(e.target);});
  },{rootMargin:'-45% 0px -45% 0px',threshold:0});
  secs.forEach(function(s){io.observe(s);});
})();
</script>
</body>
</html>
