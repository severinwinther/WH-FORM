<!DOCTYPE html>
<html lang="no" class="arbeider">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WH FORM — ARBEIDER</title>
<meta name="description" content="WH FORM — norsk produksjonsverksted for gravsteiner og monumenter.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

  <!-- MASTHEAD -->
  <header class="masthead">
    <div class="m-brand">
      <span>WH FORM</span>
      <span>OSLO</span>
    </div>
    <nav class="nav">
      <a href="index.html" class="current">Arbeider</a>
      <a href="prosess.html">Prosess</a>
      <a href="om.html">Om</a>
    </nav>
  </header>

  <!-- STREAM -->
  <main class="stream">
    <section class="project" data-index="01" data-title="Kirke" data-material="Grønn marmor" data-year="2026"><img src="kirke.png" alt="Kirke"></section>
    <section class="project" data-index="02" data-title="Over" data-material="Rød granitt" data-year="2026"><img src="Over.png" alt="Over"></section>
    <section class="project" data-index="03" data-title="Kors" data-material="Blå naturstein" data-year="2026"><img src="Kors.png" alt="Kors"></section>
    <section class="project" data-index="04" data-title="Himmel" data-material="Grønn marmor" data-year="2026"><img src="Himmel.png" alt="Himmel"></section>
    <section class="project" data-index="05" data-title="Oval" data-material="Sort granitt" data-year="2026"><img src="Oval.png" alt="Oval"></section>
    <section class="project" data-index="06" data-title="Skrå" data-material="Blå naturstein" data-year="2026"><img src="Skraa.png" alt="Skrå"></section>
    <section class="project" data-index="07" data-title="Bue" data-material="Rød granitt" data-year="2026"><img src="Bue.png" alt="Bue"></section>
    <section class="project" data-index="08" data-title="Fals" data-material="Grå granitt" data-year="2026"><img src="Fals.png" alt="Fals"></section>
    <section class="project" data-index="09" data-title="Løft" data-material="Blå marmor" data-year="2026"><img src="Loft.png" alt="Løft"></section>
  </main>

  <!-- FAST TEKST (byttes ved scrolling) -->
  <div class="ann-fixed" aria-live="polite">
    <div class="af af-left"><span class="cap af-index">01</span><span class="cap af-title">Kirke</span></div>
    <div class="af af-right"><span class="cap af-material">Grønn marmor</span><span class="cap af-year">2026</span></div>
  </div>

  <!-- FOOTER BAR -->
  <div class="footbar">
    <span class="cap">Utvalgte arbeider</span>
    <span class="cap">© 2026</span>
  </div>

<script>
(function(){
  var secs=[].slice.call(document.querySelectorAll('.project'));
  var box=document.querySelector('.ann-fixed');
  var n=secs.length; if(!n)return;
  var el={i:box.querySelector('.af-index'),t:box.querySelector('.af-title'),m:box.querySelector('.af-material'),y:box.querySelector('.af-year')};
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var K,PERSP,SMOOTH=reduce?1:0.16;
  var tops=[],heights=[],vh=0,sm=window.scrollY,running=false,active=-1,timer,idle,touching=false;

  function measure(){
    vh=window.innerHeight;
    var mobile=window.innerWidth<768;
    K=reduce?0:(mobile?15:28);
    PERSP=mobile?900:1300;
    var y=window.scrollY;
    secs.forEach(function(s,i){var r=s.getBoundingClientRect();tops[i]=r.top+y;heights[i]=r.height;});
  }
  function setText(k){var d=secs[k].dataset;el.i.textContent=d.index;el.t.textContent=d.title;el.m.textContent=d.material;el.y.textContent=d.year;}
  function swap(k){
    if(k===active)return; var first=active<0; active=k;
    if(first){setText(k);return;}
    box.classList.add('swap');clearTimeout(timer);
    timer=setTimeout(function(){setText(k);box.classList.remove('swap');},150);
  }
  function nearest(y){
    var best=0,bd=1e9;
    for(var i=0;i<n;i++){var d=Math.abs(tops[i]+heights[i]/2-vh/2-y);if(d<bd){bd=d;best=i;}}
    return best;
  }
  /* Bildene følger alltid den ekte scrollen (ingen translate fra JS).
     Bare vinkel/lysstyrke glattes, så det aldri kan gynge i posisjon. */
  function render(){
    var y=window.scrollY;
    sm+=(y-sm)*SMOOTH;
    if(Math.abs(y-sm)<0.1)sm=y;
    for(var i=0;i<n;i++){
      var c=tops[i]+heights[i]/2;
      var d=(c-sm-vh/2)/vh;
      var ad=Math.abs(d);
      var rot=Math.max(-40,Math.min(40,-d*K));
      secs[i].style.transform='perspective('+PERSP+'px) rotateX('+rot.toFixed(2)+'deg)';
      secs[i].style.opacity=(1-Math.min(ad,1)*0.45).toFixed(3);
    }
    swap(nearest(y));
    if(sm!==y)requestAnimationFrame(render);else running=false;
  }
  function kick(){if(!running){running=true;requestAnimationFrame(render);}}

  /* Rolig "setting" mot nærmeste stein – først når scrollen har stoppet helt */
  function settle(){
    if(touching||reduce)return;
    var y=window.scrollY,k=nearest(y);
    var targetY=Math.round(tops[k]+heights[k]/2-vh/2);
    if(Math.abs(targetY-y)>2)window.scrollTo({top:targetY,behavior:'smooth'});
  }
  function onScroll(){kick();clearTimeout(idle);idle=setTimeout(settle,180);}

  window.addEventListener('scroll',onScroll,{passive:true});
  window.addEventListener('touchstart',function(){touching=true;clearTimeout(idle);},{passive:true});
  window.addEventListener('touchend',function(){touching=false;clearTimeout(idle);idle=setTimeout(settle,220);},{passive:true});
  window.addEventListener('wheel',function(){clearTimeout(idle);},{passive:true});
  window.addEventListener('resize',function(){measure();kick();});
  window.addEventListener('load',function(){measure();kick();});
  measure();kick();
})();
</script>
</body>
</html>
